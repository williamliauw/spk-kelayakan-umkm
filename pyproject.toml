[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spk-kelayakan-umkm"
version = "1.0.0"
description = "Sistem Pendukung Keputusan kelayakan bantuan UMKM dengan AHP dan WP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
visual = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
terminal = ["tabulate>=0.9"]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
